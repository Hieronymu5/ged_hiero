<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hiero · GEDCOM explorer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    try {
      var t = localStorage.getItem('ged-hiero-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
    // Mirror the language choice (saved, else the browser's) so the page is tagged correctly early.
    try {
      var l = localStorage.getItem('ged-hiero-lang');
      if (l !== 'en' && l !== 'nl') {
        l = 'en';
        var prefs = navigator.languages || [navigator.language];
        for (var i = 0; i < prefs.length; i++) {
          var base = String(prefs[i]).toLowerCase().split('-')[0];
          if (base === 'en' || base === 'nl') { l = base; break; }
        }
      }
      document.documentElement.lang = l;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
